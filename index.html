<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1014">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Layout: single column "console" with sticky step strip, slide-up prompt drawer and a bottom tab bar. Deliberately one dark studio look. */
:root{
  color-scheme:dark;
  --bg:#0e1014; --surface:#161920; --raised:#1e222b; --sunk:#0b0d11; --line:#2a2f3a; --line-soft:#222731;
  --ink:#efe9dc; --muted:#9aa0ac; --dim:#6d7380;
  --amber:#f2a93b; --amber-ink:#1a1206; --amber-soft:#3a2a12; --amber-glow:rgba(242,169,59,.45);
  --good:#5fd08e; --warn:#f2c14e; --bad:#ef6b5b;
  --brass:var(--amber); --brass-ink:var(--amber-ink); --brass-soft:var(--amber-soft);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --tabbar:64px; --drawerbar:56px;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(var(--tabbar) + var(--drawerbar) + env(safe-area-inset-bottom,0px) + 32px);
  background-image:radial-gradient(1200px 500px at 50% -200px,rgba(242,169,59,.07),transparent 70%)}
.app{max-width:860px;margin:0 auto}

/* app bar */
.appbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:34px;height:34px;flex:none;border-radius:9px;background:var(--raised);border:1px solid var(--line);display:grid;place-items:center}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em;margin:0;line-height:1.1;white-space:nowrap}
.brand h1 span{color:var(--amber)}
.brand .song{display:block;font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}

/* step strip */
nav.rail{position:sticky;top:0;z-index:15;display:flex;gap:6px;overflow-x:auto;padding:10px 0 12px;margin:0 0 4px;background:linear-gradient(var(--bg) 80%,transparent);scrollbar-width:none}
nav.rail::-webkit-scrollbar{display:none}
.rail button{all:unset;cursor:pointer;flex:none;display:flex;gap:8px;align-items:center;min-height:40px;padding:0 14px 0 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:14px;font-weight:500}
.rail button .n{font-family:var(--f-mono);font-size:12px;width:22px;height:22px;display:grid;place-items:center;border-radius:50%;background:var(--sunk);color:var(--dim)}
.rail button.done .n{color:var(--amber)}
.rail button[aria-current="step"]{color:var(--ink);border-color:var(--amber);background:var(--raised)}
.rail button[aria-current="step"] .n{background:var(--amber);color:var(--amber-ink)}
.rail button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* panel */
main.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:clamp(18px,4vw,30px);min-width:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber)}
h2{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,5vw,30px);margin:6px 0 8px;letter-spacing:-.015em;text-wrap:balance;line-height:1.15}
.lede{color:var(--muted);margin:0 0 24px;max-width:60ch}
.q{margin:0 0 26px}
.q > .lbl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-family:var(--f-mono);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);margin-bottom:10px}
.q .hint{font-family:var(--f-body);text-transform:none;letter-spacing:0;font-size:13px;color:var(--dim)}
.tipbtn{all:unset;cursor:pointer;width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid var(--line);color:var(--muted);font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:700;font-size:14px;letter-spacing:0;text-transform:none}
.tipbtn[aria-expanded="true"]{border-color:var(--amber);color:var(--amber)}
.tipbtn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.tip{font-size:14px;color:var(--ink);background:var(--sunk);border:1px solid var(--line-soft);border-radius:10px;padding:10px 12px;margin:0 0 12px;max-width:62ch}

/* chips with an LED */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:9px;min-height:44px;padding:0 16px 0 13px;border:1px solid var(--line);border-radius:12px;background:var(--raised);font-size:15px;line-height:1.2;color:var(--ink);box-sizing:border-box}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line);flex:none}
.chip:hover{border-color:#3a4150}
.chip[aria-pressed="true"]{border-color:var(--amber);background:linear-gradient(var(--amber-soft),var(--raised))}
.chip[aria-pressed="true"]::before{background:var(--amber);box-shadow:0 0 8px var(--amber-glow)}
.chip:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.chip small{opacity:.75}
.group-label{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:16px 0 8px}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.card{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:4px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--raised);box-sizing:border-box;position:relative}
.card b{font-family:var(--f-display);font-weight:700;font-size:17px;padding-right:18px}
.card span{color:var(--muted);font-size:14px}
.card::after{content:"";position:absolute;top:16px;right:14px;width:8px;height:8px;border-radius:50%;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line)}
.card[aria-pressed="true"]{border-color:var(--amber);background:linear-gradient(var(--amber-soft),var(--raised))}
.card[aria-pressed="true"]::after{background:var(--amber);box-shadow:0 0 8px var(--amber-glow)}
.card:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

select,input[type=text],input[type=number],textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;max-width:100%}
select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
textarea{width:100%;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.slot{border:1px solid var(--line-soft);background:var(--raised);border-radius:12px;padding:14px}
.slot h3{font-size:15px;margin:0 0 10px;font-weight:600}
.bpm{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bpm output{font-family:var(--f-mono);font-weight:500;font-size:40px;min-width:3ch;font-variant-numeric:tabular-nums;color:var(--amber);text-shadow:0 0 18px rgba(242,169,59,.25)}
input[type=range]{accent-color:var(--amber);width:min(320px,100%);height:32px}
.toggle{display:inline-flex;gap:10px;align-items:center;cursor:pointer;min-height:44px}
.toggle input{accent-color:var(--amber);width:20px;height:20px;flex:none}
.inst-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.inst-row{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;background:var(--raised);border:1px solid var(--line-soft);border-radius:12px}
.inst-row b{font-weight:600}
.inst-row select{width:100%}
.x{all:unset;cursor:pointer;color:var(--muted);padding:8px 10px;border-radius:8px;font-size:14px}
.x:hover{color:var(--bad)}
.x:focus-visible{outline:2px solid var(--amber)}
.note{font-size:14px;color:var(--muted);border-left:3px solid var(--amber);padding:8px 12px;margin:10px 0 0;background:var(--sunk);border-radius:0 10px 10px 0;max-width:68ch}
.warnline{color:var(--warn);font-size:14px;margin-top:8px}
.nav-btns{display:flex;justify-content:space-between;gap:10px;margin-top:30px;padding-top:20px;border-top:1px solid var(--line-soft)}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 20px;border-radius:12px;font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--raised);color:var(--ink);text-align:center;box-sizing:border-box}
.btn:hover{border-color:#3a4150}
.btn.primary{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.small{min-height:38px;padding:0 14px;font-size:14px;white-space:nowrap}

/* folded advanced options */
.linkbtn{all:unset;cursor:pointer;color:var(--amber);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.linkbtn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.seq-transport{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.seq-transport #seqPlay{min-width:96px}
.seq-tempo{display:flex;align-items:center;gap:8px}
.seq-bpm{font-family:var(--f-display);font-size:30px;font-weight:700;color:var(--amber);min-width:56px;text-align:center}
.seq-unit{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-left:-6px}
.seq-opts{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 8px}
.seq-opts select{flex:1 1 180px}
.seq-swing{display:flex;align-items:center;gap:12px;margin:4px 0 14px;font-size:14px;color:var(--muted)}
.seq-swing input{flex:1}
.seq-swing b{color:var(--ink)}
.seq{display:flex;flex-direction:column;gap:6px}
.seq-row{display:grid;grid-template-columns:72px 1fr;gap:6px;align-items:center}
.seq-lab{all:unset;cursor:pointer;font-size:12.5px;font-weight:600;line-height:1.15;color:var(--ink);padding:6px 4px;border-radius:8px;text-align:left}
.seq-lab:active{background:var(--raised)}
.seq-lab:focus-visible{outline:2px solid var(--amber)}
.seq-cells{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:3px}
.seq.len12 .seq-cells{grid-template-columns:repeat(12,minmax(0,1fr))}
.sq{all:unset;box-sizing:border-box;cursor:pointer;height:38px;border-radius:6px;background:var(--sunk);border:1px solid var(--line);position:relative}
.sq.alt{background:var(--raised)}
.sq.on{background:var(--amber);border-color:var(--amber);opacity:.62}
.sq.acc{opacity:1;box-shadow:inset 0 0 0 2px #fff6}
.sq[data-roll="2"]::after,.sq[data-roll="3"]::after{content:attr(data-roll);position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:700;color:#14110b}
.sq[data-roll="2"],.sq[data-roll="3"]{opacity:1}
.sq.now{outline:2px solid var(--ink);outline-offset:-2px}
.sq:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
@media (max-width:599px){
  .seq-cells{grid-template-columns:repeat(8,minmax(0,1fr));row-gap:4px}
  .seq.len12 .seq-cells{grid-template-columns:repeat(6,minmax(0,1fr))}
  .seq-row{grid-template-columns:58px 1fr}
}
.chpal{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px}
.chbtn,.chslot{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;padding:6px 4px;border-radius:10px;border:1px solid var(--line);background:var(--raised);text-align:center}
.chbtn b,.chslot b{font-family:var(--f-display);font-size:16px;font-weight:700;color:var(--ink)}
.chbtn span,.chslot span{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.chbtn:active{background:var(--sunk)}
.chgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.chbar{border:1px solid var(--line);border-radius:10px;background:var(--sunk);padding:4px;display:flex;flex-direction:column;gap:3px}
.chbar.sel{border-color:var(--amber)}
.chbar.now{background:rgba(240,170,60,.14)}
.chbarnum{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);padding:0 3px}
.chhalves{display:flex;gap:3px}
.chhalf{all:unset;box-sizing:border-box;cursor:pointer;flex:1 1 0;min-width:0;min-height:52px;border-radius:7px;background:var(--raised);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;text-align:center;padding:2px}
.chhalf b{font-family:var(--f-display);font-size:15px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}
.chhalf span{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.chhalf.empty b{color:var(--muted)}
.chhalf.sel{box-shadow:inset 0 0 0 2px var(--amber)}
.chhalf.now{background:rgba(240,170,60,.3)}
.chhalf:focus-visible{outline:2px solid var(--amber)}
.chprog{display:flex;flex-wrap:wrap;gap:6px}
.chslot{flex:1 1 0;min-width:70px;background:var(--sunk)}
.chslot[aria-pressed="true"]{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
.chslot.now{background:rgba(240,170,60,.18);border-color:var(--amber)}
.chbtn:focus-visible,.chslot:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.mtabs{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 8px}
.mtabs::before{content:"Bar";font-family:var(--f-mono);font-size:12px;color:var(--muted);align-self:center;margin-right:4px}
.mtab{all:unset;box-sizing:border-box;cursor:pointer;min-width:38px;height:36px;padding:0 6px;border-radius:8px;border:1px solid var(--line);background:var(--raised);font-family:var(--f-mono);font-size:13px;color:var(--ink);display:grid;place-items:center;position:relative}
.mtab[aria-pressed="true"]{border-color:var(--amber);background:rgba(240,170,60,.16)}
.mtab.has::after{content:"";position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--amber)}
.mtab:focus-visible{outline:2px solid var(--amber)}
.mgrid{display:flex;flex-direction:column;gap:3px;--cols:8}
.mrow{display:grid;grid-template-columns:44px repeat(var(--cols),minmax(0,1fr));gap:3px;align-items:stretch}
.mlab{all:unset;box-sizing:border-box;cursor:pointer;font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--ink);display:flex;align-items:center;padding-left:4px}
.mchord{font-family:var(--f-mono);font-size:10.5px;color:var(--amber);white-space:nowrap;overflow:visible;min-height:16px}
.mcell{all:unset;box-sizing:border-box;cursor:pointer;height:30px;border-radius:5px;background:var(--sunk);border:1px solid var(--line)}
.mcell.alt{background:var(--raised)}
.mcell.on{background:var(--amber);border-color:var(--amber)}
.m808 .mcell.on{background:#8f6bd8;border-color:#8f6bd8}
.m808 .mcell.slide{background:linear-gradient(90deg,#8f6bd8 55%,#c9b6f2)}
.m808{margin-top:6px}
.mcell.now{outline:2px solid var(--ink);outline-offset:-2px}
.mcell:focus-visible,.mlab:focus-visible{outline:2px solid var(--amber)}
.btn{max-width:100%;box-sizing:border-box;text-align:center}
details.fold{border:1px solid var(--line-soft);background:var(--raised);border-radius:12px}
details.fold > summary{cursor:pointer;list-style:none;min-height:52px;display:flex;align-items:center;gap:10px;padding:10px 14px;font-weight:600;font-size:16px}
details.fold > summary::-webkit-details-marker{display:none}
details.fold > summary::after{content:"";margin-left:auto;flex:none;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-3px);transition:transform .15s}
details.fold[open] > summary::after{transform:rotate(-135deg) translateY(-2px)}
details.fold > summary:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
details.fold > .fold-body{padding:0 14px 14px}
details.fold .sum-sub{display:block;font-weight:400;font-size:13px;color:var(--muted);margin-top:2px}
details.fold .sum-mono{display:block;font-family:var(--f-mono);font-weight:400;font-size:12px;color:var(--brass);margin-top:4px;word-break:break-word}
details.fold .count{flex:none;font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--amber);background:rgba(240,170,60,.12);border-radius:20px;padding:2px 9px}
.fold-list{display:flex;flex-direction:column;gap:8px}
.choice-desc{margin:10px 0 0;font-size:14px;color:var(--muted)}
.choice-desc b{color:var(--ink);font-weight:600}
.toast{display:flex;align-items:center;gap:14px}
.toast button{all:unset;cursor:pointer;font-weight:700;color:var(--bg);text-decoration:underline;text-underline-offset:3px;padding:6px 2px}
details.more{margin:6px 0 0;border:1px dashed var(--line);border-radius:12px;padding:0 14px}
details.more > summary{cursor:pointer;list-style:none;min-height:50px;display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
details.more > summary::-webkit-details-marker{display:none}
details.more > summary::before{content:"+";display:grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--raised);color:var(--amber);font-size:16px}
details.more[open] > summary::before{content:"–"}
details.more[open]{padding-bottom:6px}
details.more > summary:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* prompt + meters */
.prompt{font-family:var(--f-mono);font-size:13px;line-height:1.65;white-space:pre-wrap;word-break:break-word;background:var(--sunk);border:1px solid var(--line-soft);border-radius:10px;padding:14px;max-height:46vh;overflow:auto;margin:0;color:var(--ink)}
.prompt .seg-id{color:var(--amber)}
.prompt .seg-ex{color:var(--bad)}
.meter{height:10px;background:var(--sunk);border-radius:3px;overflow:hidden;border:1px solid var(--line-soft);position:relative}
.meter i{display:block;height:100%;background:var(--good);transition:width .2s;
  -webkit-mask:repeating-linear-gradient(90deg,#000 0 6px,transparent 6px 8px);mask:repeating-linear-gradient(90deg,#000 0 6px,transparent 6px 8px)}
.meter-label{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.checks{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.checks li{display:flex;gap:10px;align-items:flex-start}
.checks .dot{flex:none;width:9px;height:9px;border-radius:50%;margin-top:7px;background:var(--good);box-shadow:0 0 6px rgba(95,208,142,.5)}
.checks .w .dot{background:var(--warn);box-shadow:0 0 6px rgba(242,193,78,.5)}
.checks .b .dot{background:var(--bad);box-shadow:0 0 6px rgba(239,107,91,.5)}
.settings{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.settings dt{color:var(--muted)}
.settings dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.result-block{margin-bottom:18px}
.result-block .prompt{max-height:none}

/* drawer */
#drawer{position:fixed;left:0;right:0;bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px));z-index:30;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -10px 30px rgba(0,0,0,.45)}
#drawer .bar{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;height:var(--drawerbar);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#drawer .bar:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}
#drawer .bar .lab{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);flex:none}
#drawer .bar .meter{flex:1;max-width:420px}
#drawer .bar .count{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;flex:none}
#drawer .bar .chev{flex:none;width:28px;height:28px;display:grid;place-items:center;border-radius:8px;background:var(--raised);color:var(--amber);transition:transform .2s}
#drawer.open .bar .chev{transform:rotate(180deg)}

<style>
/* Layout: single column "console" with sticky step strip, slide-up prompt drawer and a bottom tab bar. Deliberately one dark studio look. */
:root{

.app{max-width:860px;margin:0 auto}

/* app bar */
.appbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px}

details.fold .sum-sub{display:block;font-weight:400;font-size:13px;color:var(--muted);margin-top:2px}

.choice-desc{margin:10px 0 0;font-size:14px;color:var(--muted)}

.meter i{display:block;height:100%;background:var(--good);transition:width .2s;

.meter-label{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}

/* drawer */
#drawer{position:fixed;left:0;right:0;bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px));z-index:30;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -10px 30px rgba(0,0,0,.45)}

@media (min-width:900px){#drawer .inner{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--sunk);border-top:1px solid var(--line);

.board .rowh{position:sticky;left:0;background:var(--surface);text-align:left;font-weight:600;min-width:132px;max-width:170px;z-index:1;border-right:1px solid var(--line)}

function buildDesk(){

  if(S.delivery!=="instrumental"){
    tag("lead vocal",[

      snake(LANG.find(x=>x[0]===S.lang)?.[1]),

      "close_proximity_effect","center"]);
  }
  const drumParts=[...S.feel.map(k=>snake(FEEL.find(x=>x[0]===k)?.[1])), S.kick?snake(KICK_TEXT[S.kick]):""];
  if(drumParts.some(Boolean)) tag("drums",[...drumParts,"center"]);
  let side=0;
  S.inst.forEach(([id,job])=>{
    let pan;
    if(["bass","rhythm"].includes(job)) pan="mono_center";
    else if(["harmony","texture"].includes(job)) pan="wide_stereo";
    else pan = (side++%2===0) ? "slight_left" : "slight_right";
    tag(INST_NAME[id].replace(/\s*\(.*\)/,""),[snake(JOB_TEXT[job]),pan]);

  const arc=[snake(ARCS.find(a=>a[0]===S.arc)?.[1]),...S.arcx.map(k=>snake(ARC_EXTRA.find(x=>x[0]===k)?.[1]))];
  if(S.loop) arc.push("one_melody_loop_unchanged");

  L.push(`[ARRANGEMENT | ${arc.filter(Boolean).join(" | ")}]`);

  const emo = S.emotion==="custom" ? S.emoCustom.trim() : EMO_TEXT[S.emotion];
  if(emo) L.push(`[MOOD | ${snake(emo)}]`);
  return L.join("\n");
}

    ["extra drum feel words",()=>st.feel.length>3,()=>st.feel.pop()],
    ["second and third mix lines",()=>st.mix.length>1,()=>st.mix.pop()],
    ["more sound-quality terms",()=>st.prod.length>2,()=>st.prod.pop()],
    ["the feeling line",()=>!!st.emotion,()=>{st.emotion=""}],
    ["recording era",()=>!!st.era,()=>{st.era=""}],
    ["instruments after the 4th",()=>st.inst.length>4,()=>st.inst.pop()],
    ["second helper genre",()=>!!st.g3,()=>{st.g3=""}],
    ["more tone and processing words",()=>st.timbre.length+st.proc.length>1,()=>{st.proc.length?st.proc.pop():st.timbre.pop()}],
    ["more drum feel words",()=>st.feel.length>2,()=>st.feel.pop()]
  ];
  for(const [label,can,act] of steps){
    let used=false;
    while(len()>LIMIT && can()){act();used=true}
    if(used) dropped.push(label);
    if(len()<=LIMIT) break;
  }
  let text=withState(st,()=>rawStyle());
  if(text.length>LIMIT){const cut=text.lastIndexOf(". ",LIMIT-1);text=cut>0?text.slice(0,cut+1):text.slice(0,LIMIT);dropped.push("the end of the prompt (hard cut)")}
  return {text,patch:st,dropped,raw};
}

const esc = s => s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function renderSheet(){
  const F=fit();
  withState(F.patch,()=>{
  const segs = S.format==="tags" ? [["id",rawStyle(false)]] : S.desk ? [["id",macroTag().replace(/\.$/,"")]].filter(x=>x[1]) : segments();
  let html = segs.map(([k,t],i)=> k==="id" ? `<span class="seg-id">${esc(t)}</span>` : esc(t)).join(". ");
  if(html) html += ".";
  const ex = excludeTerms();
  if(S.inlineEx && ex.length) html += ` <span class="seg-ex">${esc(ex.map(e=>"-"+e).join(", "))}</span>`;
  if(S.desk) html += `\n\n<span style="opacity:.7">Mixing-desk mode: the full setup goes at the top of the Lyrics box (see the last step).</span>`;
  if(F.dropped.length) html += `\n\n<span style="color:var(--warn)">Trimmed to fit (was ${F.raw}): dropped ${esc(F.dropped.join(", "))}.</span>`;
  document.getElementById("livePrompt").innerHTML = html || `<span style="opacity:.6">Your Style prompt appears here as you choose. Start by picking a song to build from, or a genre.</span>`;
  });
  const n = F.text.length;
  const bar = document.getElementById("meterBar");
  bar.style.width = Math.min(100,n/10)+"%";
  bar.style.background = n>1000?"var(--bad)":n>850?"var(--warn)":"var(--good)";
  document.getElementById("charCount").textContent = `${n} / 1000`;
  document.getElementById("charState").textContent = n>1000?"too long":n>850?"nearly full":"fits";
  renderChecks(n);

}
function renderChecks(n){
  const c = [];
  const push=(lvl,t)=>c.push(`<li class="${lvl}"><span class="dot"></span><span>${t}</span></li>`);
  (fit().dropped.length ? push("w",`Trimmed from ${fit().raw} to fit. Remove a few choices to keep them all`) : 0), n<=1000 ? push("","Under 1000 characters") : push("b","Over 1000 characters. Trim instruments or mix lines");
  S.primary ? push("","One primary identity") : push("w","No primary genre yet");
  const g = [S.primary,S.g2,S.g3].filter(Boolean).length;
  g<=3 ? push("",`${g} genre${g===1?"":"s"} (max 3)`) : push("b","More than 3 genres");
  S.key ? push("","BPM, key and feel set") : push("w","No key set. Suno will pick one");
  S.kick ? push("","Kick pattern chosen") : push("w","No kick pattern. Suno will default to the same grid every bar");
  S.inst.length>=2 ? push("",`${S.inst.length} instruments, each with a job`) : push("w","Add at least 2 instruments with jobs");
  S.mix.length>=1 && S.mix.length<=3 ? push("","Clear mix hierarchy") : push("w", S.mix.length?"Keep mix to 1–3 lines":"Pick what dominates the mix");
  const ex = excludeTerms().filter(e=>!EXCLUDE_SOUND.includes(e)).length;
  const exs = excludeTerms().filter(e=>EXCLUDE_SOUND.includes(e)).length;
  ex===0 ? push("w","No style excludes yet") : ex<=5 ? push("",`${ex} style excludes (keep it short)`) : push("w",`${ex} style excludes. Guides suggest 3–5`);
  exs ? push("",`${exs} anti-muffle excludes`) : push("w","No anti-muffle excludes. v6 tends to sound veiled without them");
  S.prod.length ? (S.prod.length<=5 ? push("",`Sound-quality clause (${S.prod.length} terms)`) : push("w","Sound-quality clause is long. Leave room for the music")) : push("w","No sound-quality clause. v6 mixes tend to come out muddy without one");
  S.ending ? push("","Ending clause: finish lyrics, then outro and hard stop") : push("w","No ending clause. v6 can cut off mid-lyric or drag on");
  if(S.mix.includes("wet") && S.mix.includes("dry")) push("b","Wet reverb and dry vocal contradict each other");
  if(S.exclude.includes("rap") && ["rap","halfrap"].includes(S.delivery)) push("b","You excluded rap but chose a rapped delivery");
  if(S.exclude.includes("female vocals") && S.gender!=="male") push("b","Female vocals are excluded but the singer is female");
  if(S.exclude.includes("male vocals") && S.gender!=="female") push("b","Male vocals are excluded but the singer is male");
  document.getElementById("checks").innerHTML = c.join("");
}

function chip(label,pressed,onClick,small){

}
function chipGroup(options,key,{multi=false,max=99,clearable=true}={}){
  const wrap=document.createElement("div");wrap.className="chips";
  options.forEach(([id,label])=>{
    const on = multi ? S[key].includes(id) : S[key]===id;
    wrap.appendChild(chip(label,on,()=>{
      if(multi){
        if(S[key].includes(id)) S[key]=S[key].filter(x=>x!==id);
        else { if(S[key].length>=max) S[key].shift(); S[key].push(id); }

      render();
    }));
  });
  return wrap;
}

  // mixing desk mode

  } else {

  // save recipe

}

function vibeLookup(key){const [g,v]=key.split(":");const d=GENRE_DNA[g];if(!d)return null;const x=d.vibes.find(y=>y[0]===v);return x?{g,label:x[1],phrase:x[2]}:null}
function activeVibes(){return (S.vibes||[]).map(vibeLookup).filter(Boolean)}
function applyGenreStart(gid){
  const st=GENRE_DNA[gid]?.start;if(!st)return;
  if(st.bpm)S.bpm=st.bpm; S.half=!!st.half; if(st.key)S.key=st.key; S.ts=st.ts||"4/4";
  S.feel=[...(st.feel||[])]; S.kick=st.kick||""; S.inst=(st.inst||[]).map(x=>[...x]);
  if(st.mix)S.mix=[...st.mix]; if(st.emotion)S.emotion=st.emotion;
  (GENRE_DNA[gid].avoid||[]).forEach(e=>{if(!S.exclude.includes(e)&&!["major key"].includes(e))S.exclude.push(e)});
  if(S.sections) S.sections.forEach(s=>delete s.mix);
}
function dnaPanel(){
  const box=document.createElement("div");
  const gids=[S.primary,S.g2,S.g3].filter(g=>g&&GENRE_DNA[g]);
  if(!gids.length){const n=note("Pick one of your genres above to see its sound and choose its vibe.");box.appendChild(n);return box}
  gids.forEach((g,i)=>{
    const d=GENRE_DNA[g];
    S.openGroups=S.openGroups||{};const ok="dna:"+g;
    const picked=(S.vibes||[]).filter(k=>k.startsWith(g+":")).length;
    const fb=foldBox((i===0?"":"Helper: ")+cap(GENRE_NAME[g]),{count:picked?`${picked} picked`:"",open:ok in S.openGroups?S.openGroups[ok]:(i===0||picked>0),onToggle:o=>{S.openGroups[ok]=o;save()}});
    fb.style.marginBottom="10px";const slot=fb.body;
    const sp=document.createElement("p");sp.style.cssText="margin:0 0 12px;color:var(--muted);font-size:14px";sp.textContent=d.summary;slot.appendChild(sp);
    const chips=document.createElement("div");chips.className="chips";
    d.vibes.forEach(([id,label,phrase])=>{
      const key=`${g}:${id}`;const on=(S.vibes||[]).includes(key);
      const c=chip(label,on,()=>{S.vibes=S.vibes||[];
        if(on)S.vibes=S.vibes.filter(x=>x!==key);
        else{if(S.vibes.length>=3)S.vibes.shift();S.vibes.push(key)}
        render()});
      c.title=phrase;chips.appendChild(c);
    });
    slot.appendChild(chips);
    if(i===0){
      const b=document.createElement("button");b.type="button";b.className="btn small";b.style.marginTop="12px";b.textContent="Use this genre's starting sound";
      b.addEventListener("click",()=>undoable(`Tempo, drums, instruments and mix set for ${GENRE_NAME[g]}`,()=>{applyGenreStart(g);render()}));
      slot.appendChild(b);
      if(d.note) slot.appendChild(note(d.note));
    }
    box.appendChild(fb);
  });
  const av=activeVibes();
  if(av.length){const p=document.createElement("p");p.style.cssText="font-size:14px;margin:4px 0 0";
    p.innerHTML=`<span style="color:var(--muted)">Goes into your prompt as:</span> <span style="font-family:var(--f-mono);color:var(--amber)">${esc(av.map(v=>v.phrase).join("; "))}</span>`;box.appendChild(p)}
  return box;
}

/* ---------- Arrangement board ---------- */
const BAR_OPTS=[["","bars"],["2","2 bars"],["4","4 bars"],["8","8 bars"],["12","12 bars"],["16","16 bars"],["24","24 bars"],["32","32 bars"]];
const TYPICAL_BARS={"Short Instrumental Intro":4,"Instrumental Intro":8,"Intro":4,"Build":4,"Verse":16,"Pre-Chorus":8,"Chorus":8,"Hook":8,"Post-Chorus":4,"Interlude":4,"Bridge":8,"Instrumental Bridge":8,"Breakdown":8,"Instrumental":8,"Final Chorus":8,"Outro":8,"Instrumental Outro":4};
const LEVEL_NAME=["off","quiet","full"];
function boardRows(){
  return [{id:"vocal",name:"Lead vocal",short:"lead vocal"},{id:"backing",name:"Backing vocals",short:"backing vocals"},{id:"drums",name:"Drums",short:"drums"},
    ...S.inst.map(([id,job])=>({id,name:cap(INST_NAME[id]),short:INST_NAME[id].replace(/\s*\(.*\)/,""),job}))];
}
const isIntro=t=>/Intro/.test(t), isOutro=t=>/Outro/.test(t), isChorusT=t=>/Chorus|Hook/.test(t);
function defaultLevel(sec,row){
  const t=sec.t, noLyr=SEC_NO_LYRICS.includes(t)||sec.reg==="none";
  if(sec.lv===row.id) return 0;
  if(sec.ent===row.id) return 2;
  if(row.id==="vocal") return noLyr?0:(["soft","whisper"].includes(sec.voc)||t==="Intro")?1:2;
  if(row.id==="backing") return (isChorusT(t)||sec.arr.includes("harm"))&&!noLyr?2:0;
  if(row.id==="drums"){ if(isIntro(t)||sec.arr.includes("nodrums"))return 0; if(isOutro(t)||t==="Build")return 1; return 2; }
  const job=row.job;
  if(job==="bass"||job==="rhythm"){ if(isIntro(t))return 0; if(sec.arr.includes("nodrums")&&job==="rhythm")return 0; return isOutro(t)?1:2; }
  if(job==="counter") return isChorusT(t)?2:0;
  if(job==="stabs") return isIntro(t)?0:1;
  if(job==="texture") return 1;
  if(sec.arr.includes("strip")) return 0;
  return 2;
}
function lvl(sec,row){ return sec.mix && row.id in sec.mix ? sec.mix[row.id] : defaultLevel(sec,row); }
function boardOn(){ return S.boardUsed && S.useBoard!==false; }
function boardDiff(i){
  const rows=boardRows(), sec=S.sections[i], prev=i>0?S.sections[i-1]:null;
  const out=[];
  if(!prev){
    const on=rows.filter(r=>r.id!=="vocal"&&lvl(sec,r)>0).map(r=>(lvl(sec,r)===1?"soft ":"")+r.short);
    if(on.length) out.push(on.length<=3?`${list(on)} only`:`opens with ${list(on)}`);
    return out;
  }
  const allFull=rows.every(r=>lvl(sec,r)===2), prevAllFull=rows.every(r=>lvl(prev,r)===2);
  if(allFull&&!prevAllFull){out.push("full arrangement returns");return out}
  const g={enters:[],"drops out":[],"pulls back":[],"comes forward":[]};
  rows.forEach(r=>{
    if(r.id==="vocal") return;
    const a=lvl(prev,r),b=lvl(sec,r);
    if(a===0&&b>0) g.enters.push((b===1?"soft ":"")+r.short);
    else if(a>0&&b===0) g["drops out"].push(r.short);
    else if(a===2&&b===1) g["pulls back"].push(r.short);
    else if(a===1&&b===2) g["comes forward"].push(r.short);
  });
  Object.entries(g).forEach(([k,v])=>{ if(!v.length) return;
    const plural = v.length>1 || (/s$/.test(v[0]) && !/ss$/.test(v[0]));
    out.push(`${list(v)} ${plural?k.replace("enters","enter").replace("drops","drop").replace("pulls","pull").replace("comes","come"):k}`)});
  return out;
}
function boardSummary(){
  const parts=[];const seen=new Set();
  S.sections.forEach((sec,i)=>{
    const d=boardDiff(i);
    const key=sec.t+"|"+d.join();
    if(i>0&&(!d.length||seen.has(key))) return;
    seen.add(key);
    parts.push(`${i===0?cap(sec.t.toLowerCase()):sec.t.toLowerCase()}: ${d.join(", ")||"same as before"}`);
  });
  let t=parts.join("; ");
  if(S.boardShort) t=parts.slice(0,3).join("; ");
  else if(t.length>380){t=parts.slice(0,5).join("; ")}
  return t;
}
function stepBoard(p){
  if(!S.sections||!S.sections.length) S.sections=SEC_TEMPLATES.standard.secs.map(blankSec);
  const rows=boardRows();
  if(S.inst.length<2) p.appendChild(note("Tip: pick your instruments on step 5 first. Each one gets its own row here."));

  const top=document.createElement("div");top.className="row";
  const tb=document.createElement("button");tb.type="button";tb.className="btn small";tb.textContent="Fill typical bar lengths";
  tb.addEventListener("click",()=>{S.sections.forEach(s=>{if(!s.bars)s.bars=String(TYPICAL_BARS[s.t]||8)});render()});
  const rs=document.createElement("button");rs.type="button";rs.className="btn small";rs.textContent="Reset boxes to suggestions";
  rs.addEventListener("click",()=>{S.sections.forEach(s=>delete s.mix);render()});
  const ad=document.createElement("button");ad.type="button";ad.className="btn small";ad.textContent="Add section";
  ad.addEventListener("click",()=>{S.sections.splice(Math.max(0,S.sections.length-1),0,blankSec({t:"Verse"}));render()});
  top.append(tb,rs,ad);p.appendChild(top);

  // grid
  const wrap=document.createElement("div");wrap.className="board-wrap";
  const tbl=document.createElement("table");tbl.className="board";
  const thead=document.createElement("thead");const hr=document.createElement("tr");
  hr.appendChild(Object.assign(document.createElement("th"),{className:"rowh",textContent:"Sound"}));
  S.sections.forEach((sec,i)=>{
    const th=document.createElement("th");
    const ts=selectEl(`bd-t-${i}`,SEC_TYPES.map(x=>[x,x]),sec.t,v=>{sec.t=v});ts.setAttribute("aria-label",`Section ${i+1} type`);
    const bs=selectEl(`bd-b-${i}`,BAR_OPTS.slice(1),sec.bars||"",v=>{sec.bars=v},"bars");bs.setAttribute("aria-label",`Section ${i+1} length`);
    const x=document.createElement("button");x.type="button";x.className="x";x.textContent="×";x.setAttribute("aria-label",`Remove section ${i+1}`);
    x.addEventListener("click",()=>{S.sections.splice(i,1);render()});
    th.append(ts,bs,x);hr.appendChild(th);
  });
  thead.appendChild(hr);tbl.appendChild(thead);
  const tbody=document.createElement("tbody");
  // kick row
  const kr=document.createElement("tr");kr.appendChild(Object.assign(document.createElement("th"),{className:"rowh",textContent:"Kick pattern"}));
  S.sections.forEach((sec,i)=>{const td=document.createElement("td");
    const ks=selectEl(`bd-k-${i}`,KICKS.map(k=>[k[0],k[1]]),sec.kick,v=>{sec.kick=v;S.boardUsed=true},"same");ks.setAttribute("aria-label",`Kick pattern, section ${i+1}`);
    td.appendChild(ks);kr.appendChild(td)});
  tbody.appendChild(kr);
  rows.forEach(r=>{
    const tr=document.createElement("tr");
    tr.appendChild(Object.assign(document.createElement("th"),{className:"rowh",textContent:r.name}));
    S.sections.forEach((sec,i)=>{
      const td=document.createElement("td");const v=lvl(sec,r);
      const b=document.createElement("button");b.type="button";b.className=`cell l${v}`;
      b.setAttribute("aria-label",`${r.name}, ${sec.t} ${i+1}: ${LEVEL_NAME[v]}`);
      b.textContent=v===2?"full":v===1?"quiet":"";
      b.addEventListener("click",()=>{sec.mix=sec.mix||{};sec.mix[r.id]=(v+1)%3;S.boardUsed=true;render()});
      td.appendChild(b);tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);wrap.appendChild(tbl);
  p.appendChild(q("Tap a box: off → quiet → full","scroll sideways for more sections",wrap));

  const leg=document.createElement("div");leg.className="row";leg.style.cssText="font-size:13px;color:var(--muted);gap:14px";
  leg.innerHTML=`<span><i class="cell l0 sw"></i> off</span><span><i class="cell l1 sw"></i> quiet</span><span><i class="cell l2 sw"></i> full</span>`;
  p.appendChild(leg);

  const use=document.createElement("label");use.className="toggle";use.style.marginTop="14px";
  use.innerHTML=`<input type="checkbox" id="useBoard" ${boardOn()?"checked":""}> Use this board in my prompt`;
  use.querySelector("input").addEventListener("change",e=>{S.useBoard=e.target.checked;S.boardUsed=S.boardUsed||e.target.checked;render()});
  p.appendChild(use);

  if(boardOn()){
    const sum=document.createElement("pre");sum.className="prompt";sum.id="boardSum";sum.style.marginTop="10px";sum.textContent="Arrangement: "+boardSummary();
    p.appendChild(q("Goes in the Style box","replaces the song-shape line",sum));
    const hd=document.createElement("pre");hd.className="prompt";hd.id="boardHeads";hd.style.maxHeight="none";
    hd.textContent=S.sections.map(sec=>secHeader(sec).text).join("\n");
    p.appendChild(q("Goes in the Lyrics box","full skeleton with lyric lines is on the Section tags page",hd));
    const go=document.createElement("button");go.type="button";go.className="btn primary";go.textContent="Open Section tags";
    go.addEventListener("click",()=>{step=STEPS.findIndex(x=>x.render===stepSections);render();window.scrollTo({top:0})});
    p.appendChild(go);
  } else p.appendChild(note("Tap any box and the board switches on. Until then, your prompt uses the song shape from step 6."));
}

/* ---------- 2. Lyric brief ---------- */
const AVOID_WORDS = "neon, ghost, ashes, embers, flames, void, abyss, shadows, echoes, chains, crown, throne, halo, angels, storm, mirror, demons, canvas";
const AVOID_RHYMES = "fire/desire, heart/apart, night/light, pain/rain, soul/whole, time/mind, tears/fears, fall/all";
function buildBrief(){
  const emo = S.emotion==="custom" ? S.emoCustom.trim() : EMO_TEXT[S.emotion];
  const secs = (S.sections||[]).filter(s=>!SEC_NO_LYRICS.includes(s.t)&&s.reg!=="none").map(s=>s.t);
  const lang = LANG.find(x=>x[0]===S.lang)?.[1];
  const L=[];
  L.push(`Write lyrics for a song${S.title?` called "${S.title}"`:""}.`,"");
  L.push(`Theme: ${S.theme||"(write your theme here)"}`);
  L.push(`Perspective: ${S.persp||"first person"}`);
  if(lang) L.push(`Language: ${lang}`);
  if(emo) L.push(`Feeling: ${emo}`);
  if(S.primary) L.push(`Genre: ${GENRE_NAME[S.primary]}, ${S.bpm} BPM${S.half?" half-time":""}`);
  L.push(`Delivery: ${DELIVERY.find(x=>x[0]===S.delivery)?.[1]||"sung"}`);
  if(secs.length) L.push(`Sections, in order: ${secs.join(", ")}`);
  L.push("","Style:");
  L.push("- Chorus lines short, artsy and poetic, not basic.");
  L.push("- Concrete images and specific, lived-in details over abstract statements.");
  L.push("- Mostly 6–10 syllables a line, but vary the lengths.");
  L.push("- Use hyphens, not em dashes.");
  L.push("- Lines in the same spot of each verse within 1–2 syllables of each other, so they sit on the beat.");
  L.push("- One central image or metaphor for the whole song, explored from different angles.");
  L.push("- At least one small, unglamorous real-life detail.");
  L.push("- The ending should feel different from the start: the story moves.");
  if(S.bryson) L.push("- Write like Bryson Tiller: uneven, conversational verses with \"yeah\" tags, a short chorus, a spoken interlude and a faster closing verse.");
  L.push("",`Avoid these overused words: ${AVOID_WORDS}.`);
  L.push("Avoid these phrases: rise from the ashes, broken wings, weight of the world, lost in the dark, find the light, written in the stars, chasing dreams, through the fire.");
  L.push("Go easy on: endless, eternal, hollow, broken, shattered, fading, crimson, golden, empty, frozen. Avoid stock time clichés like \"3 AM\".");
  L.push(`Avoid these lazy rhymes: ${AVOID_RHYMES}.`);
  if(S.adlibs) L.push("- Script the ad-libs: add short ad-libs in (parentheses) at the end of some lines, like (yeah), (ooh), (oh no), (uh), matching the genre. Two or three per verse at most.");
  L.push("- Mark longer breaths with an ellipsis (...) or an empty line between lines.");
  L.push("","Put each section name in [brackets] on its own line. Nothing else goes in brackets. Use (parentheses) only for backing vocals, echoes and ad-libs.");
  return L.join("\n");
}
function stepBrief(p){
  const t=document.createElement("textarea");t.id="theme";t.rows=3;t.value=S.theme||"";t.placeholder="e.g. Promising her I'd change, knowing I wouldn't. Pride over love.";

const RULEBOOK_SHORT=`Rules for a Suno v6 Style prompt:
- Order: identity (one main genre, up to two helper genres each with a concrete job) → pulse (BPM + time signature + how the drums play) → voice (described like an instrument: type, register, tone, delivery, processing) → instruments (each named with one or two jobs) → arc (how verse, chorus, bridge and finale differ) → mix (what's loudest and what sits under it) → emotion (a progression, not one adjective) → excludes as dash-prefixed terms like -rap.
- 1000 characters or fewer in total, including excludes.
- Every clause must change something you can hear; cut adjectives that change nothing.
- No negatives in the main text ("no drums"); unwanted things go in the excludes.
- Avoid words that drag the genre: epic, cinematic, heavy, operatic, powerful.
- Climaxes grow through layers, register and density, not just loudness.
- Keep the song's own identity; don't swap in a different genre or singer.`;
function askPromptFix(txt){return `${RULEBOOK_SHORT}

Improve this Style prompt so it follows those rules more closely, keeping the same song, genre, tempo, singer and instruments. Fix only what breaks a rule or wastes characters.

Prompt:
${txt}

Reply in exactly this format, plain text, no markdown:
STYLE PROMPT:
(the improved prompt, 1000 characters or fewer, excludes at the end as -terms)

WHAT I CHANGED:
- (up to 4 short lines in plain everyday English)`}
function askLyricsPrompt(){return buildBrief()+`

Write the full lyrics now. Put each section header in square brackets on its own line, in the order listed, and only lyrics under each header (no instructions, no notes). If the language isn't English, write it the way a native speaker would actually sing it. After the lyrics, add one line starting "CHECK:" listing any lines a native speaker should double-check.`}
function askErr(e){const c=e&&e.code;
  if(c==="not_granted"){SAMPLE_OFF=true;return "Claude wasn't allowed for this page, so the Ask Claude buttons are hidden now. Reload the page if you change your mind."}
  if(c==="cancelled"||c==="aborted")return "Stopped.";
  if(c==="rate_limited")return "Claude is busy right now. Wait a minute and try again.";
  if(window.FORGE_DESKTOP&&e&&e.message)return e.message;
  return "Couldn't reach Claude just now. Try again in a moment."}
function askBox(id,label,makePrompt,{hint="",extract=null}={}){
  if(!SAMPLE||SAMPLE_OFF) return null;
  const w=document.createElement("div");w.className="askbox";
  const row=document.createElement("div");row.className="row";row.style.cssText="flex-wrap:wrap;gap:8px";
  const go=document.createElement("button");go.type="button";go.className="btn primary";go.id=id+"Go";go.textContent=label;
  const stop=document.createElement("button");stop.type="button";stop.className="btn";stop.textContent="Stop";stop.hidden=true;
  const cp=document.createElement("button");cp.type="button";cp.className="btn";cp.textContent=extract?"Copy the new prompt":"Copy";
  const out=document.createElement("pre");out.className="prompt";out.id=id+"Out";out.style.maxHeight="none";
  const st=ASK[id]||{};out.textContent=st.text||"";out.hidden=!st.text;cp.hidden=!st.done||!st.text;
  row.append(go,stop,cp);w.appendChild(row);if(hint)w.appendChild(note(hint));w.appendChild(out);
  cp.addEventListener("click",()=>{const t=ASK[id]?.text||"";copy(extract?extract(t):t,id+"Out")});
  go.addEventListener("click",async()=>{
    const prompt=makePrompt();if(!prompt){toast("Nothing to send yet");return}
    const ctl=new AbortController();ASK[id]={text:"",done:false};
    go.disabled=true;stop.hidden=false;cp.hidden=true;out.hidden=false;out.textContent="Thinking… (Claude may ask you to allow this the first time)";
    stop.onclick=()=>ctl.abort();
    try{
      const r=await SAMPLE(prompt,{signal:ctl.signal,onText:({text})=>{ASK[id].text=text;out.textContent=text}});
      ASK[id]={text:r.text,done:true};out.textContent=r.text;cp.hidden=false;
    }catch(e){
      const keep=e&&e.text?e.text+"\n\n":"";ASK[id]={text:keep+askErr(e),done:!!keep};out.textContent=ASK[id].text;cp.hidden=!keep;
      if(SAMPLE_OFF)setTimeout(render,2500);
    }finally{go.disabled=false;stop.hidden=true}
  });
  return w;
}
const askExtract=t=>{const m=t.match(/STYLE PROMPT:\s*([\s\S]*?)(?:\n\s*WHAT I CHANGED:|$)/i);return (m?m[1]:t).trim()};

    if(pr.apply){
      const b=document.createElement("button");b.type="button";b.className="btn small";b.style.marginTop="10px";b.textContent="Apply the fix";

/* ---------- 5. Prompt checker ---------- */
const GRAVITY = ["epic","cinematic","heavy","doom","operatic","screaming","industrial","aggressive","anthemic","ambient"];
const VAGUE = ["beautiful","emotional vocals","professional production","realistic","lush","ethereal","shimmering","amazing","perfect","banger"];
const GENRE_WORDS = ["trap","drill","r&b","rnb","soul","pop","rock","hip hop","hip-hop","boom bap","ambient","lo-fi","lofi","jazz","gospel","edm","house","techno","afrobeat","reggaeton","dancehall","phonk","synthwave","metal","punk","emo","folk","country","rai","raï","grime","garage","dubstep","funk","disco","trip-hop","cloud rap","pluggnb","neo-soul"];
function findKey(txt){
  let m=txt.match(/\b([A-Ga-g])(#|b|♯|♭)?\s*(minor|major|min|maj)\b/i);
  let root,mode;
  if(m){root=m[1].toUpperCase()+(m[2]||"");mode=/^maj/i.test(m[3])?"major":"minor"}
  else{m=txt.match(/\b([A-G])(#|b)?m\b/);if(!m)return null;root=m[1]+(m[2]||"");mode="minor"}
  root=root.replace("♯","#").replace("♭","b");
  const flat={"Db":"C#","Eb":"D#","Gb":"F#","Ab":"G#","Bb":"A#","Cb":"B","Fb":"E"};
  root=flat[root]||root;
  const key=`${root} ${mode}`;return KEYS.includes(key)?key:null;
}
function checkPrompt(txt){
  const out=[];const add=(lvl,t)=>out.push([lvl,t]);
  const low=txt.toLowerCase();
  const n=txt.length;
  n===0 ? add("w","Paste a prompt to check it") : n<=1000 ? add("",`${n} characters, fits`) : add("b",`${n} characters. Over the 1000 limit by ${n-1000}`);
  if(!n) return out;
  const genres=[...new Set(GENRE_WORDS.filter(g=>new RegExp(`(^|[^a-z])${g.replace(/[.*+?^${}()|[\]\\&]/g,"\\$&")}([^a-z]|$)`).test(low)))];
  genres.length<=3 ? add("",`Genres spotted: ${genres.join(", ")||"none"}`) : add("w",`${genres.length} genres spotted (${genres.join(", ")}). Max 3, each with a job`);
  /\d{2,3}\s*bpm/i.test(txt) ? add("","BPM is set") : add("w","No BPM found");
  findKey(txt) ? add("",`Key is set (${findKey(txt)})`) : add("w","No key found");
  /kick/i.test(txt) ? add("","Kick pattern mentioned") : add("w","No kick pattern. Suno will default to the same grid every bar");
  const segs=txt.split(/[,.;|]/).map(s=>s.trim()).filter(Boolean);
  const avg=segs.reduce((a,s)=>a+s.split(/\s+/).length,0)/Math.max(1,segs.length);
  if(segs.length>12 && avg<3) add("w","Reads like a tag cloud. Fine if it's working for you, otherwise describe what each sound does");
  if(segs.length>20) add("w",`About ${segs.length} tags. Past ~20, Suno gets confused`);
  if(/["“”]/.test(txt)) add("w","Quotes in the Style box can get sung as lyrics. Remove them");
  const caps=(txt.match(/\b[A-Z]{4,}\b/g)||[]).filter(w=>!/^(BPM|EDM|LUFS|MPC|DX7|TR)/.test(w));
  if(caps.length) add("w",`ALL-CAPS words (${caps.slice(0,3).join(", ")}) can get sung. Use normal case`);
  if(/crescendo/i.test(txt)) add("w","'Crescendo' is often ignored. Say 'building intensity' instead");
  if(genres[0]) add("",`First genre carries the most weight: ${genres[0]}`);
  const g=GRAVITY.filter(w=>new RegExp(`\\b${w}\\b`).test(low));
  if(g.length) add("w",`Gravity words: ${g.join(", ")}. These can drag the whole song toward their own genre`);
  const v=VAGUE.filter(w=>low.includes(w));
  if(v.length) add("w",`Vague words: ${v.join(", ")}. Say what you actually want to hear`);
  const neg=[...txt.matchAll(/\bno ([a-z][a-z\- ]{1,20})/gi)].map(m=>m[1].trim());
  if(neg.length) add("w",`"no ${neg[0]}" in the main text. Move unwanted things to Exclude as -${neg[0]}`);
  const ex=(txt.match(/(^|[\s,])-[a-z]/gi)||[]).length;
  if(ex>5) add("w",`${ex} excludes. Keep musical excludes to 3–5`);
  if(/\bdry\b/i.test(txt)&&/(reverb[- ]heavy|lush reverb|wet)/i.test(txt)) add("b","Dry vocal and heavy reverb contradict each other");
  if(/minimal|sparse/i.test(txt)&&/wall of sound|dense/i.test(txt)) add("b","Minimal/sparse and wall of sound/dense contradict each other");
  if(/female vocal/i.test(low.replace(/-female vocals?/g,""))&&/\bmale vocal/i.test(low.replace(/-male vocals?|female vocals?/g,""))) add("w","Both male and female vocals are asked for. Intended as a duet?");
  /(transient|high[- ]fidelity|hi-fi|close[- ]mic)/i.test(txt) ? add("","Has a sound-quality clause") : add("w","No sound-quality clause. v6 tends to sound muffled without one");
  /(hard stop|instrumental outro|finish every lyric|complete every)/i.test(txt) ? add("","Has an ending instruction") : add("w","No ending instruction. v6 can cut off mid-lyric or drag on");
  return out;
}
function stepCheck(p){
  const t=document.createElement("textarea");t.id="checkIn";t.rows=7;t.value=S.checkTxt||"";t.placeholder="Paste any Style prompt here, e.g. one of your old ones";
  const res=document.createElement("ul");res.className="checks";res.style.marginTop="12px";
  const draw=()=>{res.innerHTML=checkPrompt(t.value).map(([l,x])=>`<li class="${l}"><span class="dot"></span><span>${esc(x)}</span></li>`).join("")};
  t.addEventListener("input",e=>{S.checkTxt=e.target.value;draw();save()});
  draw();
  const w=document.createElement("div");w.append(t,res);
  p.appendChild(q("Paste a prompt","checked against the rulebook as you type",w));
  const ld=document.createElement("button");ld.type="button";ld.className="btn";ld.textContent="Load what I can into the steps";
  ld.addEventListener("click",()=>{
    const txt=t.value;const low=txt.toLowerCase();let got=[];
    const b=txt.match(/(\d{2,3})\s*bpm/i);if(b){S.bpm=+b[1];got.push("BPM")}
    if(/half[- ]time/i.test(txt)){S.half=true}
    const k=findKey(txt);if(k){S.key=k;got.push("key")}
    const g=GENRES.flatMap(x=>x.items).sort((a,b)=>b.name.length-a.name.length).find(i=>low.includes(i.name.toLowerCase()));
    if(g){S.primary=g.id;got.push("main genre")}
    const exs=[...txt.matchAll(/(?:^|[\s,])-([a-z][a-z&\- ]*[a-z])/gi)].map(m=>m[1].trim());
    if(exs.length){S.exclude=[...new Set(exs)];got.push("excludes")}
    toast(got.length?`Loaded ${got.join(", ")}`:"Couldn't pick anything out");render();
  });
  p.appendChild(ld);
  p.appendChild(note("Loading picks out the BPM, key, main genre and excludes. Instruments, voice and arc still need choosing in the steps."));
  const ab=askBox("askCheck","Ask Claude to fix it",()=>(t.value||"").trim()?askPromptFix(t.value.trim()):"",{extract:askExtract,hint:"Claude rewrites the pasted prompt to follow the rulebook and says what it changed."});
  if(ab)p.appendChild(q("Ask Claude","",ab));
}

/* ---------- 6. Cover / Extend / Remaster ---------- */
function soundsPrompt(){
  const mel=S.inst.find(x=>x[1]==="melody");
  const name=mel?INST_NAME[mel[0]].replace(/\s*\(.*\)/,""):"dark melodic";
  const g=S.primary?GENRE_NAME[S.primary]:"trap";
  const emo=S.emotion&&S.emotion!=="custom"?EMO_TEXT[S.emotion].split(" ").slice(0,3).join(" "):"moody";
  return `${name} melody loop, simple and repeating, ${emo}, ${g}, no drums`;
}
function albumArt(){
  const emo=S.emotion&&S.emotion!=="custom"?EMO_TEXT[S.emotion]:(S.emoCustom||"moody");
  const g=S.primary?GENRE_NAME[S.primary]:"dark trap";
  const t=(S.title||"UNTITLED").toUpperCase().split(" ").slice(0,2).join(" ");
  return `album art: ${g} single cover, lone figure in a dim city at night, ${emo}, grainy film photo, deep shadows with one warm light, minimal, text reads "${t}"`;
}

/* ---------- Fusion builder: one creator's Sounds → Studio → Cover workflow for genre fusions ---------- */
const FU_ROLES=[["melody","Lead melody loop"],["chords","Chords only"],["bass","Bass line"],["drums","Drum loop"],["texture","Texture"]];
const FU_ROLE_TEXT={melody:"single melody loop, lead line only, no drums",chords:"chord loop only, no melody, no drums",bass:"bass line loop only, no drums, no melody",drums:"drum loop only, no melody, no bass",texture:"texture loop only, no drums"};
const FU_VOX=[["none","No vocal"],["sung","Sung"],["rap","Rap"]];
const FU_SECS=["Intro","Hook","Verse","Pre-Chorus","Chorus","Bridge","Breakdown","Outro"];
const FUSION_EXAMPLE={
  genres:"pop rap, Thai funk fusion, surf rock (pre-chorus only)",mood:"confident, playful, bold, fierce",bpm:78,key:"E minor",
  inst:[{n:"Thai phin",r:"melody",c:"tense, Phrygian, sharp picked attack, biting note edges, quick grace notes, aggressive small pitch bends and slides"},
        {n:"Hip hop drums",r:"drums",c:"stomping kick, crisp snare"},
        {n:"808 bass",r:"bass",c:"deep, round, follows the kick"},
        {n:"Electric bass",r:"bass",c:"short walking line that follows the guitar chords"},
        {n:"Surf rock electric guitar",r:"chords",c:"twangy, reverb-soaked spring tone, chords only"}],
  sung:"single female lead, catchy and melodic, upper chest register",
  rap:"confident, charismatic female lead rap, swagger, one syllable per word, punchy delivery, full-bodied chest tone",
  secs:[{t:"Hook",i:[0,1,2],v:"sung"},{t:"Verse",i:[1,2],v:"rap"},{t:"Pre-Chorus",i:[1,3,4],v:"rap"},{t:"Hook",i:[0,1,2],v:"sung"},
        {t:"Verse",i:[1,2],v:"rap"},{t:"Pre-Chorus",i:[1,3,4],v:"rap"},{t:"Hook",i:[0,1,2],v:"sung"}]
};
function fusionFromSong(){
  const g=[S.primary,S.g2,S.g3].filter(Boolean).map(x=>GENRE_NAME[x]).join(", ");
  const emo=S.emotion&&S.emotion!=="custom"?EMO_TEXT[S.emotion]:(S.emoCustom||"");
  const roleOf=j=>({melody:"melody",riff8:"melody",riffverse:"melody",counter:"melody",harmony:"chords",stabs:"chords",bass:"bass",rhythm:"drums",texture:"texture",fill:"texture"}[j]||"texture");
  const inst=S.inst.map(([id,j])=>({n:cap(INST_NAME[id]),r:roleOf(j),c:""}));
  if(!inst.some(x=>x.r==="drums")) inst.push({n:cap(S.primary?GENRE_NAME[S.primary]:"hip hop")+" drums",r:"drums",c:(S.feel||[]).map(f=>(FEEL.find(x=>x[0]===f)||[,""])[1]).filter(Boolean).slice(0,2).join(", ")});
  const all=inst.map((_,i)=>i);
  const voc=S.delivery==="rap"?"rap":S.delivery==="instrumental"?"none":"sung";
  return {genres:g,mood:emo,bpm:S.bpm,key:S.key||"",inst,sung:"",rap:"",
    secs:[{t:"Intro",i:all.filter(i=>inst[i].r!=="bass"),v:"none"},{t:"Verse",i:all,v:voc},{t:"Hook",i:all,v:S.delivery==="rap"?"rap":"sung"},{t:"Verse",i:all,v:voc},{t:"Hook",i:all,v:S.delivery==="rap"?"rap":"sung"}]};
}
function fuSoundPrompt(f,x){
  const parts=[`${x.n} ${FU_ROLE_TEXT[x.r]}`];
  if(x.c) parts.push(x.c);
  return parts.join(", ");
}
function fuBox(title,num){
  S.openGroups=S.openGroups||{};const k="fu"+num;
  return foldBox(`${num}. ${title}`,{open:k in S.openGroups?S.openGroups[k]:num==="1",onToggle:o=>{S.openGroups[k]=o;save()}});
}
function fuCopy(text,id,label){
  const w=document.createElement("div");
  const pre=document.createElement("pre");pre.className="prompt";pre.id=id;pre.style.marginTop="8px";pre.textContent=text;w.appendChild(pre);
  const b=document.createElement("button");b.type="button";b.className="btn small";b.style.marginTop="8px";b.textContent=label||"Copy";
  b.addEventListener("click",()=>copy(text,id));w.appendChild(b);return w;
}
function fuSettings(rows){const dl=document.createElement("dl");dl.className="settings";dl.innerHTML=rows.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("");return dl}
function stepFusion(p){
  const f=S.fusion;
  const top=document.createElement("div");top.className="row";top.style.flexWrap="wrap";top.style.gap="8px";
  const ex=document.createElement("button");ex.type="button";ex.className="btn";ex.textContent="Load the worked example";
  ex.addEventListener("click",()=>undoable("Loaded the Thai funk × pop rap example",()=>{S.fusion=structuredClone(FUSION_EXAMPLE);render()}));
  const mine=document.createElement("button");mine.type="button";mine.className="btn";mine.textContent="Start from my song";
  mine.addEventListener("click",()=>undoable("Filled from your song's genres, tempo and instruments",()=>{S.fusion=fusionFromSong();render()}));
  top.append(ex,mine);p.appendChild(top);
  if(S.noUpload!==false) p.appendChild(warnBox("Heads up: step 4 of this method exports your rough mix and uploads it back to Suno to Cover it. The loops are made inside Suno, but if you'd rather not upload anything, use steps 1–2 for ideas and build the song with the Style prompt and Section tags instead."));
  p.appendChild(note("Why: a fusion typed as one long tag list (pop rap, Thai funk, surf rock, every instrument, both vocal styles) comes out generic. Here you make each sound on its own, place them yourself, then let a Cover polish it."));
  p.appendChild(note("Short of ideas for the blend? Suno buttons & Studio → \"Steal a style\" gets Suno to write a fusion Style from two clashing genres."));
  if(!f){p.appendChild(note("Load the example to see how it works, or start from the song you've built in the Build tab."));return}

  const fl=document.createElement("div");fl.className="fold-list";fl.style.marginTop="12px";p.appendChild(fl);
  /* 1. ingredients */
  const b1=fuBox("Ingredients: genre, mood, instruments, vocals","1");
  const inp=(val,ph,on,id,multi)=>{const t=document.createElement(multi?"textarea":"input");if(multi){t.rows=2;t.style.resize="vertical"}else t.type="text";t.value=val||"";t.placeholder=ph;t.style.width="100%";if(id)t.id=id;t.addEventListener("input",e=>{on(e.target.value);save()});t.addEventListener("change",()=>render());return t};
  const lab=t=>{const l=document.createElement("div");l.style.cssText="font-size:13px;color:var(--muted);margin:10px 0 4px";l.textContent=t;return l};
  b1.body.append(lab("Genres, and where each one shows up"),inp(f.genres,"e.g. pop rap, Thai funk, surf rock (pre-chorus only)",v=>f.genres=v,"fu-genres"));
  b1.body.append(lab("Mood"),inp(f.mood,"e.g. confident, playful, bold",v=>f.mood=v,"fu-mood"));
  const row=document.createElement("div");row.className="row";row.style.gap="8px";row.style.flexWrap="wrap";
  const bpm=document.createElement("input");bpm.type="number";bpm.min=50;bpm.max=200;bpm.value=f.bpm;bpm.style.width="90px";bpm.setAttribute("aria-label","Fusion BPM");
  bpm.addEventListener("change",e=>{f.bpm=Math.max(50,Math.min(200,+e.target.value||90));render()});
  const key=selectEl("fu-key",KEYS.map(k=>[k,k]),f.key,v=>{f.key=v},"Key: pick one");
  row.append(bpm,key);b1.body.append(lab("Tempo and key. Every loop must share these so they fit together"),row);
  b1.body.append(lab("Instruments: one loop each"));
  const il=document.createElement("div");il.className="inst-list";
  f.inst.forEach((x,i)=>{
    const r=document.createElement("div");r.className="slot";r.style.padding="10px";
    const nm=inp(x.n,"Instrument, e.g. Thai phin",v=>x.n=v);nm.setAttribute("aria-label",`Instrument ${i+1} name`);
    const rs=selectEl(`fu-r-${i}`,FU_ROLES,x.r,v=>{x.r=v});rs.style.width="100%";rs.style.marginTop="6px";
    const ch=inp(x.c,"How it's played, e.g. sharp picked attack, quick slides",v=>x.c=v,null,true);ch.style.marginTop="6px";ch.setAttribute("aria-label",`Instrument ${i+1} playing style`);
    const rm=document.createElement("button");rm.type="button";rm.className="x";rm.textContent="Remove";rm.style.marginTop="6px";
    rm.addEventListener("click",()=>undoable(`Removed ${x.n||"instrument"}`,()=>{f.inst.splice(i,1);f.secs.forEach(s=>{s.i=s.i.filter(k=>k!==i).map(k=>k>i?k-1:k)});render()}));
    r.append(nm,rs,ch,rm);il.appendChild(r);
  });
  b1.body.appendChild(il);
  const add=document.createElement("button");add.type="button";add.className="btn small";add.style.marginTop="8px";add.textContent="Add an instrument";
  add.addEventListener("click",()=>{f.inst.push({n:"",r:"melody",c:""});render()});b1.body.appendChild(add);
  b1.body.append(lab("Sung vocal style"),inp(f.sung,"e.g. single female lead, catchy, upper chest register",v=>f.sung=v,"fu-sung",true));
  b1.body.append(lab("Rap vocal style"),inp(f.rap,"e.g. confident, punchy, one syllable per word, chest tone",v=>f.rap=v,"fu-rap",true));
  fl.appendChild(b1);

  /* 2. sounds */
  const b2=fuBox("Make each sound in Suno Sounds","2");
  b2.body.appendChild(fuSettings([["Create tab","Sounds"],["Type","Loop"],["BPM",String(f.bpm)],["Key",f.key||"pick one and keep it"]]));
  f.inst.forEach((x,i)=>{if(!x.n)return;const h=document.createElement("div");h.style.cssText="margin-top:12px;font-weight:600";h.textContent=x.n;b2.body.appendChild(h);b2.body.appendChild(fuCopy(fuSoundPrompt(f,x),`fu-s-${i}`,"Copy sound prompt"))});
  b2.body.appendChild(note("Make each one in v6 and in v6-wild, then keep the best. Ask for one sound only (\"lead line only\", \"no drums\"); a lone 808 is the hardest to get, so take the closest and move on."));
  fl.appendChild(b2);

  const b3=fuBox("Lay the loops out in Studio","3");

    const acts=document.createElement("div");acts.className="row";acts.style.gap="2px";

const REC={on:false,t0:0,steps:0,prev:null};

      const st=CH_STEP;setTimeout(()=>chRecStatus(st),Math.max(0,(CH_NEXT-AC.currentTime)*1000));
      CH_NEXT+=d;CH_STEP++;if(CH_STEP===0)REC.t0=CH_NEXT;continue}
    if(REC.on){
      if(CH_STEP%4===0&&!c.drums)chClick(CH_NEXT,CH_STEP%16===0);
      if(REC.steps>=total){chRecFinish();}
      else REC.steps++;
    }
    chScheduleStep(CH_STEP%total,CH_NEXT);
    if(REC.on&&CH_STEP%16===0){const st=CH_STEP;setTimeout(()=>chRecStatus(st),Math.max(0,(CH_NEXT-AC.currentTime)*1000))}
    CH_NEXT+=d;CH_STEP=(CH_STEP+1)%total}}
function chRecStatus(st){const el=document.getElementById("chRecStatus");if(!el)return;

function chRecTap(slot){

const MEL_SOUNDS=[["bells","Bells","glassy bell"],["flute","Flute","breathy flute"],["piano","Piano","piano"],["rhodes","Rhodes","Rhodes"],["lead","Synth lead","soft synth lead"]];
function melState(){
  const c=chState();
  if(!S.mel) S.mel={oct:0,sound:"bells",legato:false,notes:{},b808:{},withChords:true,withDrums:false,page:0};
  const m=S.mel;m.notes=m.notes||{};m.b808=m.b808||{};

let MEL808=null;
function mel808(pc,t,dur,slideTo){
  const c=AC;if(MEL808){try{MEL808.g.gain.setTargetAtTime(0.0001,t,0.01);MEL808.o.stop(t+0.05)}catch(e){}}
  let m=36+pc;if(m>43)m-=12;const o=c.createOscillator();o.type="sine";o.frequency.setValueAtTime(mtof(m),t);

let MEL_TIMER=null,MEL_NEXT=0,MEL_STEP=0;let melPlaying=false;
function melNextHit(m,from,total){for(let i=1;i<=total;i++){const k=(from+i)%total;if(m.b808[k])return k}return null}
function melSchedule(gstep,t){
  const c=chState(),m=melState(),d=60/S.bpm/4,total=c.nb*16;

/* words for Suno */
function melDescribe(c,m,short){
  const total=c.nb*16,keys=Object.keys(m.notes).map(Number).sort((a,b)=>a-b);
  if(!keys.length) return "";
  const snd=MEL_SOUNDS.find(x=>x[0]===m.sound)[2];
  const perBar=keys.length/c.nb;
  const dens=perBar<=3?"sparse":perBar<=6?"steady":perBar<=9?"8th-note":"busy 16th-note";
  const bar1=keys.filter(k=>k<16),names=bar1.slice(0,8).map(k=>melRowName(c,m.notes[k]).replace("'",""));
  const sig=b=>Object.keys(m.notes).map(Number).filter(k=>k>=b*16&&k<b*16+16).map(k=>`${k-b*16}:${m.notes[k]}`).join(",");
  const repeats=c.nb>1&&Array.from({length:c.nb},(_,b)=>sig(b)).every((x,_,a)=>x===a[0]);
  const rows=keys.map(k=>m.notes[k]);const first=rows[0],last=rows.at(-1),hi=Math.max(...rows),lo=Math.min(...rows);
  const contour=hi===lo?"on one note":last>first?"rising":last<first?"falling":hi>first?"rising then falling back":"dipping then returning";
  const start=seqPos({len:16},keys[0]%16);
  if(short) return `${snd} riff ${names.join("-")}`;
  let t=`${dens} ${snd} melody riff in ${chKeyName(c)}`+(names.length?`: ${names.join(" – ")}`:"")+`, ${contour}, starting on ${start==="1"?"the 1":start}`;
  t+=repeats?", repeating every bar":c.nb>1?`, a ${c.nb}-bar phrase`:"";
  if(m.legato) t+=", smooth and connected"; else t+=", short detached notes";
  return t;
}
function b808Describe(c,m,short){

}
