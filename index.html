  tr.append(tgl("melCh","withChords","with chords"),tgl("melDr","withDrums","with drums"));
  p.appendChild(tr);
  /* page tabs */
  const per=window.innerWidth>=600?16:8,pages=total/per;if(m.page>=pages)m.page=0;
  const tabs=document.createElement("div");tabs.className="mtabs";tabs.setAttribute("role","group");tabs.setAttribute("aria-label","Which part of the loop");
  for(let i=0;i<pages;i++){const bar=Math.floor(i*per/16)+1,half=per===8?(i%2?"b":"a"):"";
    const has=Array.from({length:per},(_,j)=>i*per+j).some(g=>m.notes[g]!=null||m.b808[g]);
    const tb=document.createElement("button");tb.type="button";tb.className="mtab"+(has?" has":"");tb.setAttribute("aria-pressed",m.page===i?"true":"false");tb.textContent=`${bar}${half}`;tb.setAttribute("aria-label",`Bar ${bar}${half?(half==="a"?", first half":", second half"):""}${has?", has notes":""}`);
    tb.addEventListener("click",()=>{m.page=i;render()});tabs.appendChild(tb)}
  p.appendChild(tabs);
  /* grid */
  const grid=document.createElement("div");grid.className="mgrid";grid.style.setProperty("--cols",per);
  const steps=Array.from({length:per},(_,j)=>m.page*per+j);
  const chordRow=document.createElement("div");chordRow.className="mrow";
  const cl=document.createElement("div");cl.className="mlab";cl.textContent="Chord";chordRow.appendChild(cl);
  steps.forEach(g=>{const d=document.createElement("div");d.className="mchord";if(g%16===0||g%8===0){const x=melRootAt(c,g);d.textContent=x?chName(c,x):""}chordRow.appendChild(d)});
  grid.appendChild(chordRow);
  for(let row=7;row>=0;row--){
    const r=document.createElement("div");r.className="mrow";
    const lb=document.createElement("button");lb.type="button";lb.className="mlab";lb.textContent=melRowName(c,row);lb.setAttribute("aria-label",`Hear ${melRowName(c,row)}`);
    lb.addEventListener("click",()=>{if(ac()){AC.resume();melNote(melMidi(c,m,row),AC.currentTime+0.01,0.4,m.sound)}});r.appendChild(lb);
    steps.forEach(g=>{const b=document.createElement("button");b.type="button";b.className="mcell"+(Math.floor((g%16)/4)%2?" alt":"")+(m.notes[g]===row?" on":"");b.dataset.g=g;
      b.setAttribute("aria-label",`${melRowName(c,row)} at bar ${Math.floor(g/16)+1}, ${seqPos({len:16},g%16)}`);
      b.addEventListener("click",()=>{if(m.notes[g]===row)delete m.notes[g];else{m.notes[g]=row;if(ac()&&!melPlaying){AC.resume();melNote(melMidi(c,m,row),AC.currentTime+0.01,0.35,m.sound)}}
        grid.querySelectorAll(`.mcell[data-g="${g}"]`).forEach(x=>x.classList.remove("on"));if(m.notes[g]===row)b.classList.add("on");save();renderSheet();melOut()});
      r.appendChild(b)});
    grid.appendChild(r);
  }
  const br=document.createElement("div");br.className="mrow m808";
  const bl=document.createElement("div");bl.className="mlab";bl.textContent="808";br.appendChild(bl);
  steps.forEach(g=>{const b=document.createElement("button");b.type="button";const v=m.b808[g]||0;b.className="mcell"+(v?" on":"")+(v===2?" slide":"");b.dataset.g=g;
    b.setAttribute("aria-label",`808 at bar ${Math.floor(g/16)+1}, ${seqPos({len:16},g%16)}: ${["off","hit","hit and slide"][v]}`);
    b.addEventListener("click",()=>{const n=((m.b808[g]||0)+1)%3;if(n)m.b808[g]=n;else delete m.b808[g];b.className="mcell"+(n?" on":"")+(n===2?" slide":"");save();renderSheet();melOut()});
    br.appendChild(b)});
  grid.appendChild(br);
  p.appendChild(grid);
  p.appendChild(note("Tap a box to place a note (one note at a time per step). The 808 row plays each chord's root note: tap once for a hit, twice for a hit that slides into the next one. Turn the phone sideways to see a whole bar."));
  const fill=document.createElement("div");fill.className="row";fill.style.cssText="flex-wrap:wrap;gap:8px;margin-top:4px";
  const fb=(t,fn)=>{const b=document.createElement("button");b.type="button";b.className="btn small";b.textContent=t;b.addEventListener("click",fn);fill.appendChild(b)};
  fb("808 on every chord change",()=>undoable("808 placed on each chord change",()=>{m.b808={};let acc=0;chSlots(c).forEach(x=>{if(!x.rest)m.b808[acc]=1;acc+=x.len});render()}));
  fb("Copy bar 1 to every bar",()=>undoable("Bar 1 copied to every bar",()=>{for(let b=1;b<c.nb;b++)for(let j=0;j<16;j++){const g=b*16+j;delete m.notes[g];if(m.notes[j]!=null)m.notes[g]=m.notes[j];delete m.b808[g];if(m.b808[j])m.b808[g]=m.b808[j]}render()}));
  fb("Clear melody",()=>undoable("Melody cleared",()=>{m.notes={};render()}));
  fb("Clear 808",()=>undoable("808 cleared",()=>{m.b808={};render()}));
  p.appendChild(fill);
  p.appendChild(q("Melody sound","",chipGroupObj(MEL_SOUNDS.map(x=>[x[0],x[1]]),m,"sound")));
  p.appendChild(q("Register","",chipGroupObj([[-1,"Low"],[0,"Middle"],[1,"High"]],m,"oct")));
  const lg=document.createElement("label");lg.className="toggle";lg.innerHTML=`<input type="checkbox" id="melLegato" ${m.legato?"checked":""}> Notes ring on until the next note (smooth) instead of short and detached`;
  lg.querySelector("input").addEventListener("change",e=>{m.legato=e.target.checked;save();renderSheet();melOut()});p.appendChild(lg);
  /* translation */
  const res=document.createElement("div");res.className="slot";res.style.marginTop="16px";
  res.innerHTML=`<h3 style="font-size:16px">What Suno will be told</h3><pre class="prompt" id="melDesc"></pre>`;
  const u1=document.createElement("label");u1.className="toggle";u1.style.marginTop="10px";u1.innerHTML=`<input type="checkbox" id="melUse" ${S.melUse?"checked":""}> Use the melody in my Style prompt`;
  u1.querySelector("input").addEventListener("change",e=>{S.melUse=e.target.checked;save();renderSheet()});
  const u2=document.createElement("label");u2.className="toggle";u2.innerHTML=`<input type="checkbox" id="b808Use" ${S.b808Use?"checked":""}> Use the 808 line in my Style prompt`;
  u2.querySelector("input").addEventListener("change",e=>{S.b808Use=e.target.checked;save();renderSheet()});
  res.append(u1,u2);p.appendChild(res);
  p.appendChild(note("Suno takes the feel of a riff from words: its rhythm, direction and sound. It won't copy every note exactly, so the riff's shape is what to judge it on."));
  melOut();
}
function melOut(){const d=document.getElementById("melDesc");if(!d)return;const c=chState(),m=melState();
  const a=melDescribe(c,m,false),b=b808Describe(c,m,false);d.textContent=[a,b].filter(Boolean).join("\n")||"Place some notes to see the description."}

/* ---------- copy ---------- */
function copy(text,preId){
  const done=()=>toast("Copied");
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>selectText(preId));
  } else selectText(preId);
}
function selectText(id){
  const el=document.getElementById(id||"livePrompt");if(!el)return;
  const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);
  toast("Selected. Press Ctrl+C to copy");
}
function toast(msg,undo){
  document.querySelectorAll(".toast").forEach(x=>x.remove());
  const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");
  const sp=document.createElement("span");sp.textContent=msg;t.appendChild(sp);
  if(undo){const b=document.createElement("button");b.type="button";b.textContent="Undo";b.addEventListener("click",()=>{undo();t.remove()});t.appendChild(b)}
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),undo?6000:1800);
}
/* Big changes can be undone from the message that pops up */
function undoable(msg,fn){
  const keepS=structuredClone(S),keepStep=step;
  fn();
  toast(msg,()=>{S=keepS;step=keepStep;render();toast("Undone")});
}
/* a collapsible card: summary title, optional sub line, optional count badge */
function foldBox(title,{sub="",mono="",count="",open=false,onToggle}={}){
  const d=document.createElement("details");d.className="fold";d.open=open;
  const sm=document.createElement("summary");
  const tx=document.createElement("span");tx.style.minWidth="0";tx.textContent=title;
  if(sub){const x=document.createElement("span");x.className="sum-sub";x.textContent=sub;tx.appendChild(x)}
  if(mono){const x=document.createElement("span");x.className="sum-mono";x.textContent=mono;tx.appendChild(x)}
  sm.appendChild(tx);
  if(count){const c=document.createElement("span");c.className="count";c.textContent=count;sm.appendChild(c)}
  d.appendChild(sm);
  const body=document.createElement("div");body.className="fold-body";d.appendChild(body);
  let last=open;
  if(onToggle)d.addEventListener("toggle",()=>{if(d.open===last)return;last=d.open;onToggle(d.open)});
  d.body=body;return d;
}

/* ---------- render ---------- */
const TABS=[
  {id:"build",label:"Build",icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 4v16M12 4v16M19 4v16"/><circle cx="5" cy="9" r="2.2" fill="currentColor"/><circle cx="12" cy="15" r="2.2" fill="currentColor"/><circle cx="19" cy="7" r="2.2" fill="currentColor"/></svg>'},
  {id:"arrange",label:"Arrange",icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16M15 4v16"/></svg>'},
  {id:"lyrics",label:"Lyrics",icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 11h16M4 16h10"/></svg>'},
  {id:"tools",label:"Tools",icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6.5a4 4 0 0 0 5 5L13 18l-3 1 1-3 6.5-6.5"/><path d="M4 20l5-5"/></svg>'}
];
function tabOf(i){const r=STEPS[i].render;
  if([stepSeq,stepChords,stepMelody,stepBoard,stepSections,stepFusion].includes(r))return "arrange";
  if(r===stepBrief)return "lyrics";
  if(STEPS[i].tool)return "tools";
  return "build";}
const lastInTab={};
const FOLD={
  "Helper genres":1,"Recording era":1,"Tone":1,"Processing and backing":1,
  "Extras":1,"Ending":1,"Sound quality (v6)":1,"Last generation had a problem?":1,
  "Sound problems to keep out":1,"Mixing-desk mode":1,"Lyrics box rules for v6":1,"After you download":1,"Did it work? Save it exactly as it is":0
};
function foldAdvanced(p){
  const qs=[...p.querySelectorAll(":scope > .q")].filter(el=>FOLD[el.dataset.label]);
  if(!qs.length) return;
  const det=document.createElement("details");det.className="more";
  const key="more-"+step;S.openMore=S.openMore||{};det.open=!!S.openMore[key];
  det.addEventListener("toggle",()=>{S.openMore[key]=det.open;save()});
  const sm=document.createElement("summary");sm.textContent=`More options (${qs.length})`;det.appendChild(sm);
  qs.forEach(el=>{let n=el.nextElementSibling;det.appendChild(el);while(n&&!n.classList.contains("q")&&(n.classList.contains("note")||n.classList.contains("warnline"))){const nx=n.nextElementSibling;det.appendChild(n);n=nx}});
  p.appendChild(det);
}
function render(){
  if(seqPlaying&&STEPS[step].render!==stepSeq) seqStop();
  if(chPlaying&&STEPS[step].render!==stepChords) chStop();
  if(melPlaying&&STEPS[step].render!==stepMelody) melStop();
  const tab=tabOf(step);lastInTab[tab]=step;
  const rail=document.getElementById("rail");rail.innerHTML="";
  let n=0;
  STEPS.forEach((st,i)=>{
    if(tabOf(i)!==tab) return; n++;
    const b=document.createElement("button");b.type="button";
    if(i===step)b.setAttribute("aria-current","step");
    if(tab==="build"&&i<step)b.classList.add("done");
    b.innerHTML=(tab==="build"?`<span class="n">${n}</span>`:"")+`<span class="lab">${esc(st.lab)}</span>`;
    b.addEventListener("click",()=>{step=i;render();window.scrollTo({top:0})});
    rail.appendChild(b);
  });
  const cur=rail.querySelector('[aria-current="step"]');if(cur&&cur.scrollIntoView)cur.scrollIntoView({inline:"center",block:"nearest"});
  const tabs=document.getElementById("tabs");tabs.innerHTML="";
  TABS.forEach(t=>{const b=document.createElement("button");b.type="button";if(t.id===tab)b.setAttribute("aria-current","page");
    b.innerHTML=t.icon+`<span>${t.label}</span>`;
    if(tourI>=0&&TOUR[tourI].sel===`#tabs button:nth-child(${TABS.indexOf(t)+1})`)b.classList.add("tour-hi");
    b.addEventListener("click",()=>{const first=STEPS.findIndex((_,i)=>tabOf(i)===t.id);step=lastInTab[t.id]??first;render();window.scrollTo({top:0})});
    tabs.appendChild(b)});
  document.getElementById("songName").textContent=S.title?S.title:(S.primary?GENRE_NAME[S.primary]:"New song");
  const p=document.getElementById("panel");p.innerHTML="";
  const st=STEPS[step];
  const buildCount=STEPS.filter((_,i)=>tabOf(i)==="build").length;
  p.insertAdjacentHTML("beforeend",`<div class="eyebrow">${tab==="build"?`Step ${step+1} of ${buildCount}`:TABS.find(t=>t.id===tab).label}</div><h2>${esc(st.title)}</h2><p class="lede">${esc(st.lede)}</p>`);
  st.render(p);
  foldAdvanced(p);
  const nav=document.createElement("div");nav.className="nav-btns";
  const back=document.createElement("button");back.type="button";back.className="btn";back.textContent="Back";back.disabled=step===0;
  back.addEventListener("click",()=>{step=Math.max(0,step-1);render();window.scrollTo({top:0})});
  const next=document.createElement("button");next.type="button";next.className="btn primary";
  const RESULT=STEPS.findIndex(x=>x.render===stepResult);
  next.textContent = step===RESULT-1 ? "See my prompt" : step===RESULT ? "Next: arrange" : "Next";
  next.disabled = step===STEPS.length-1;
  next.addEventListener("click",()=>{step++;render();window.scrollTo({top:0})});
  nav.append(back,next);p.appendChild(nav);
  renderSheet();
}


/* ---------- Desktop app only: Claude key, model and where things are saved ---------- */
function stepDesktop(p){
  const box=document.createElement("div");box.textContent="Loading…";p.appendChild(box);
  fetch("/api/settings").then(r=>r.json()).then(st=>{
    box.innerHTML="";
    const post=(d,msg)=>fetch("/api/settings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)}).then(()=>{if(msg)toast(msg);render()});
    const kd=document.createElement("div");
    kd.appendChild(note(st.has_key?`Claude key ready (${st.key_hint}), ${st.key_from}. The Ask Claude buttons are on.`:"No Claude key yet, so the Ask Claude buttons will ask for one. Paste a key from the Claude Console (console.anthropic.com › API keys)."));
    const row=document.createElement("div");row.className="row";row.style.cssText="flex-wrap:wrap;gap:8px";
    const ki=document.createElement("input");ki.type="password";ki.id="apiKey";ki.placeholder=st.has_key?"Paste a different key to replace it":"Paste your API key (starts sk-ant-)";ki.style.cssText="flex:1 1 240px;min-width:0";ki.setAttribute("aria-label","Claude API key");ki.autocomplete="off";
    const ks=document.createElement("button");ks.type="button";ks.className="btn primary";ks.textContent="Save key";
    ks.addEventListener("click",()=>{const v=ki.value.trim();if(!v){toast("Paste a key first");return}post({key:v},"Key saved and locked to your Windows account")});
    row.append(ki,ks);kd.appendChild(row);
    const r2=document.createElement("div");r2.className="row";r2.style.cssText="flex-wrap:wrap;gap:8px;margin-top:8px";
    if(st.lyric_studio&&st.key_from!=="shared from Lyric Studio"){const u=document.createElement("button");u.type="button";u.className="btn";u.textContent="Use Lyric Studio's key";u.addEventListener("click",()=>post({use_lyric_studio:true},"Using Lyric Studio's key"));r2.appendChild(u)}
    if(st.has_key){const c=document.createElement("button");c.type="button";c.className="btn";c.textContent="Remove key";c.addEventListener("click",()=>post({clear_key:true},"Key removed"));r2.appendChild(c)}
    if(r2.children.length)kd.appendChild(r2);
    box.appendChild(q("Claude API key","locked with Windows' own encryption, never in backups",kd));
    const ms=document.createElement("select");ms.id="model";st.models.forEach(([id,n])=>{const o=document.createElement("option");o.value=id;o.textContent=n;if(id===st.model)o.selected=true;ms.appendChild(o)});
    ms.addEventListener("change",e=>post({model:e.target.value},"Model changed"));
    const mw=document.createElement("div");mw.appendChild(ms);
    mw.appendChild(note(`Spent this month: $${(st.month_usd||0).toFixed(2)}. A lyric or prompt polish usually costs a few cents on Opus, less on Sonnet.`));
    box.appendChild(q("Which Claude","",mw));
    const sd=document.createElement("div");
    sd.appendChild(note(`Saved in: ${st.data_dir}. A dated copy is kept each day for two weeks.`));
    if(st.cloud){const t=document.createElement("label");t.className="toggle";t.innerHTML=`<input type="checkbox" id="cloudBk" ${st.cloud_backup?"checked":""}> Also copy to OneDrive (Style Prompt Forge Backup)`;
      t.querySelector("input").addEventListener("change",e=>post({cloud_backup:e.target.checked},e.target.checked?"OneDrive copy on":"OneDrive copy off"));sd.appendChild(t)}
    if(st.last_backup)sd.appendChild(note(`Last copy: ${st.last_backup}`));
    if(st.backup_error)sd.appendChild(warnBox(`Backup problem: ${st.backup_error}`));
    const r3=document.createElement("div");r3.className="row";r3.style.cssText="flex-wrap:wrap;gap:8px;margin-top:8px";
    const of=document.createElement("button");of.type="button";of.className="btn";of.textContent="Open the data folder";of.addEventListener("click",()=>fetch("/api/open-data",{method:"POST"}));
    const bn=document.createElement("button");bn.type="button";bn.className="btn";bn.textContent="Back up now";bn.addEventListener("click",()=>fetch("/api/backup-now",{method:"POST"}).then(r=>r.json()).then(x=>{toast(x.ok?"Backed up":"Backup failed");render()}));
    r3.append(of,bn);sd.appendChild(r3);
    box.appendChild(q("Where your work is saved","",sd));
  }).catch(()=>{box.textContent="Couldn't reach the Forge app. Close the window and open it again."});
}

/* ---------- Guided tour (first visit, replay from Start) ---------- */
const TOUR=[
  {t:"Welcome to the Forge",x:"It builds Suno v6 prompts that follow your rulebook: Style says what the track is, the Lyrics box says what happens when. Here's a quick look around."},
  {t:"Build",x:"Eight steps, from genre to feeling. Each one adds a part of the Style prompt in the rulebook's order. Tap Next at the bottom of each step.",sel:"#tabs button:nth-child(1)"},
  {t:"Your live Style box",x:"This bar always shows your Style prompt and how close it is to 1000 characters. Tap it to open, and copy it whenever you like.",sel:"#drawerBar"},
  {t:"Arrange",x:"Make the music yourself: drum sequencer, chord builder, melody and 808, the arrangement board and section tags for the Lyrics box. Each one can play what you've made.",sel:"#tabs button:nth-child(2)"},
  {t:"Lyrics",x:"Turn your theme and sections into a lyric brief that fits the song.",sel:"#tabs button:nth-child(3)"},
  {t:"Tools",x:"Quick song, fix a problem, check an old prompt, A/B tests, your results log, backup, and settings for Suno's other buttons.",sel:"#tabs button:nth-child(4)"},
  {t:"You're set",x:"Start from a past song (try Ghorba, the raï one) or start blank. Everything saves in this browser, so make a backup now and then. Replay this tour from the Start page any time."}
];
let tourI=-1;
function tourSeen(){try{return localStorage.getItem("forge-tour")==="1"}catch(e){return true}}
function tourMark(){try{localStorage.setItem("forge-tour","1")}catch(e){}}
function tourClose(){tourI=-1;document.querySelectorAll(".tour-hi").forEach(e=>e.classList.remove("tour-hi"));const o=document.getElementById("tour");if(o)o.remove();tourMark()}
function tourShow(i){
  tourI=i;const T=TOUR[i];
  document.querySelectorAll(".tour-hi").forEach(e=>e.classList.remove("tour-hi"));
  let o=document.getElementById("tour");
  if(!o){o=document.createElement("div");o.id="tour";o.setAttribute("role","dialog");o.setAttribute("aria-modal","true");o.setAttribute("aria-labelledby","tourT");document.body.appendChild(o);
    o.addEventListener("click",e=>{if(e.target===o)tourClose()})}
  o.innerHTML=`<div class="tour-card"><div class="tour-n">${i+1} of ${TOUR.length}</div><h3 id="tourT">${esc(T.t)}</h3><p>${esc(T.x)}</p><div class="row tour-btns"></div></div>`;
  const bt=o.querySelector(".tour-btns");
  const skip=document.createElement("button");skip.type="button";skip.className="btn";skip.textContent=i===TOUR.length-1?"Close":"Skip";skip.addEventListener("click",tourClose);
  bt.appendChild(skip);
  if(i>0){const bk=document.createElement("button");bk.type="button";bk.className="btn";bk.textContent="Back";bk.addEventListener("click",()=>tourShow(i-1));bt.appendChild(bk)}
  const nx=document.createElement("button");nx.type="button";nx.className="btn primary";nx.id="tourNext";nx.textContent=i===TOUR.length-1?"Let's go":"Next";
  nx.addEventListener("click",()=>i===TOUR.length-1?tourClose():tourShow(i+1));bt.appendChild(nx);
  if(T.sel){const el=document.querySelector(T.sel);if(el)el.classList.add("tour-hi")}
  nx.focus({preventScroll:true});
}
document.addEventListener("keydown",e=>{if(tourI>=0&&e.key==="Escape")tourClose()});
let _rw=window.innerWidth>=600;window.addEventListener("resize",()=>{const w=window.innerWidth>=600;if(w!==_rw){_rw=w;if(STEPS[step].render===stepMelody)render()}});
document.getElementById("drawerBar").addEventListener("click",()=>{const d=document.getElementById("drawer");const o=!d.classList.contains("open");d.classList.toggle("open",o);document.getElementById("drawerBar").setAttribute("aria-expanded",String(o))});
document.getElementById("copySide").addEventListener("click",()=>copy(buildStyle(),"livePrompt"));
document.getElementById("resetBtn").addEventListener("click",()=>undoable("Started fresh",()=>{S=structuredClone(BLANK);step=0;render();window.scrollTo({top:0})}));
render();
if(!tourSeen()) setTimeout(()=>tourShow(0),400);
</script>
